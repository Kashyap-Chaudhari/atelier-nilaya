{% load static %}
{% if request.resolver_match.url_name != 'checkout' and request.resolver_match.url_name != 'checkout_direct' %}
<!-- ========================================================================
     MOBILE-ONLY FLOATING BOTTOM NAVIGATION BAR
     Design: White bar with 26px rounded corners, floating 14px above edges.
     Tabs: Home, Shop, Track order, Bag, Account (Equal widths).
     Active: #1a1a1a icon lifted 2px, 18px x 3px gold (#b8893b) underline.
     Bag: Wine (#6b2e3c) count badge with pop animation.
     A11y: <nav aria-label="Main">, real <a> links, aria-current="page".
     ======================================================================== -->
<nav class="mobile-bottom-nav" id="mobile-floating-nav" aria-label="Main">
  <div class="mobile-nav-inner">
    
    <!-- 1. Home -->
    <a 
      href="{% url 'campaigns:hero' %}" 
      class="mobile-nav-tab {% if request.resolver_match.url_name == 'hero' %}is-active{% endif %}" 
      id="mobile-nav-home" 
      {% if request.resolver_match.url_name == 'hero' %}aria-current="page"{% endif %}
      data-route="home"
    >
      <span class="mobile-nav-icon-wrap" aria-hidden="true">
        <svg class="mobile-nav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
        </svg>
      </span>
      <span class="mobile-nav-label">Home</span>
      <span class="mobile-nav-underline" aria-hidden="true"></span>
    </a>

    <!-- 2. Shop -->
    <a 
      href="{% url 'campaigns:vault' %}" 
      class="mobile-nav-tab {% if request.resolver_match.url_name == 'vault' or request.resolver_match.url_name == 'category_products' or request.resolver_match.url_name == 'product_detail' or request.resolver_match.url_name == 'product_detail_slug' %}is-active{% endif %}" 
      id="mobile-nav-shop" 
      {% if request.resolver_match.url_name == 'vault' or request.resolver_match.url_name == 'category_products' or request.resolver_match.url_name == 'product_detail' or request.resolver_match.url_name == 'product_detail_slug' %}aria-current="page"{% endif %}
      data-route="shop"
    >
      <span class="mobile-nav-icon-wrap" aria-hidden="true">
        <svg class="mobile-nav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1"/>
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/>
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/>
        </svg>
      </span>
      <span class="mobile-nav-label">Shop</span>
      <span class="mobile-nav-underline" aria-hidden="true"></span>
    </a>

    <!-- 3. Track order -->
    <a 
      href="{% url 'orders:track' %}" 
      class="mobile-nav-tab {% if request.resolver_match.url_name == 'track' %}is-active{% endif %}" 
      id="mobile-nav-track" 
      {% if request.resolver_match.url_name == 'track' %}aria-current="page"{% endif %}
      data-route="track"
    >
      <span class="mobile-nav-icon-wrap" aria-hidden="true">
        <svg class="mobile-nav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="16.2 7.8 13.8 14.2 7.8 16.2 10.2 9.8 16.2 7.8"/>
        </svg>
      </span>
      <span class="mobile-nav-label">Track order</span>
      <span class="mobile-nav-underline" aria-hidden="true"></span>
    </a>

    <!-- 4. Bag -->
    <a 
      href="#bag" 
      class="mobile-nav-tab" 
      id="mobile-nav-bag" 
      data-open-bag
      aria-label="Shopping bag" 
      data-route="bag"
    >
      <span class="mobile-nav-icon-wrap" aria-hidden="true">
        <svg class="mobile-nav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3L3.5 7v13a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1V7L18 3H6z"/>
          <line x1="3.5" y1="7" x2="20.5" y2="7"/>
          <path d="M16 11a4 4 0 0 1-8 0"/>
        </svg>
        <span 
          id="mobile-bottom-bag-count" 
          class="mobile-nav-badge" 
          aria-label="{{ cart_count|default:0 }} items in bag"
          {% if not cart_count or cart_count == 0 %}style="display:none;"{% endif %}
        >{{ cart_count|default:0 }}</span>
      </span>
      <span class="mobile-nav-label">Bag</span>
      <span class="mobile-nav-underline" aria-hidden="true"></span>
    </a>

    <!-- 5. Account -->
    <a 
      href="{% if user.is_authenticated %}{% url 'campaigns:account_profile' %}{% else %}{% url 'campaigns:login' %}?next={% url 'campaigns:account_profile' %}{% endif %}" 
      class="mobile-nav-tab {% if request.resolver_match.url_name == 'account_profile' or request.resolver_match.url_name == 'login' or request.resolver_match.url_name == 'register' %}is-active{% endif %}" 
      id="mobile-nav-account" 
      {% if request.resolver_match.url_name == 'account_profile' or request.resolver_match.url_name == 'login' %}aria-current="page"{% endif %}
      data-route="account"
    >
      <span class="mobile-nav-icon-wrap" aria-hidden="true">
        <svg class="mobile-nav-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/>
          <circle cx="12" cy="7.5" r="4"/>
        </svg>
      </span>
      <span class="mobile-nav-label">Account</span>
      <span class="mobile-nav-underline" aria-hidden="true"></span>
    </a>

  </div>
</nav>
{% endif %}
