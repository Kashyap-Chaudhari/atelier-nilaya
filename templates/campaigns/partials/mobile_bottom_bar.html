{% load static %}
<!-- ========================================================================
     ATELIER NILAYA — MOBILE BOTTOM APP BAR (<= 767px ONLY)
     Fixed 6-Item Luxury Maroon Bar (#1c0b13) with Gold Top Border (#d9b56b)
     Items: Home, Shop, Orders, Track, Bag, Account
     ======================================================================== -->
<nav class="nilaya-mobile-bottom-bar" id="nilaya-mobile-bottom-bar" aria-label="Mobile Application Navigation">
  <div class="nilaya-bottom-bar-inner">
    
    <!-- 1. Home -->
    <a 
      href="{% url 'campaigns:hero' %}" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-home" 
      aria-label="Home page" 
      data-route="home"
    >
      <span class="nilaya-bottom-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </span>
      <span class="nilaya-bottom-label">Home</span>
    </a>

    <!-- 2. Shop (Opens Full Category Drawer) -->
    <button 
      type="button" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-shop" 
      aria-label="Shop all categories" 
      data-route="shop"
    >
      <span class="nilaya-bottom-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </span>
      <span class="nilaya-bottom-label">Shop</span>
    </button>

    <!-- 3. Orders (Order History) -->
    <a 
      href="{% if user.is_authenticated %}{% url 'orders:history' %}{% else %}{% url 'campaigns:login' %}?next={% url 'orders:history' %}{% endif %}" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-orders" 
      aria-label="Order history" 
      data-route="orders"
    >
      <span class="nilaya-bottom-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </span>
      <span class="nilaya-bottom-label">Orders</span>
    </a>

    <!-- 4. Track (Track Latest Active Order) -->
    <a 
      href="{% if user.is_authenticated %}{% url 'orders:track' %}{% else %}{% url 'campaigns:login' %}?next={% url 'orders:track' %}{% endif %}" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-track" 
      aria-label="Track order" 
      data-route="track"
    >
      <span class="nilaya-bottom-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
      </span>
      <span class="nilaya-bottom-label">Track</span>
    </a>

    <!-- 5. Bag (Opens Sliding Bag Sheet with Count Badge) -->
    <button 
      type="button" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-bag" 
      data-open-bag 
      aria-label="Shopping bag" 
      data-route="bag"
    >
      <span class="nilaya-bottom-icon nilaya-bottom-bag-wrap" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span id="mobile-bottom-bag-count" class="nilaya-bottom-bag-badge" style="display: none;">0</span>
      </span>
      <span class="nilaya-bottom-label">Bag</span>
    </button>

    <!-- 6. Account (Client Folio Profile / Login) -->
    <a 
      href="{% if user.is_authenticated %}{% url 'campaigns:account_profile' %}{% else %}{% url 'campaigns:login' %}?next={% url 'campaigns:account_profile' %}{% endif %}" 
      class="nilaya-bottom-btn" 
      id="mobile-nav-account" 
      aria-label="My account folio" 
      data-route="account"
    >
      <span class="nilaya-bottom-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
      <span class="nilaya-bottom-label">Account</span>
    </a>

  </div>
</nav>
